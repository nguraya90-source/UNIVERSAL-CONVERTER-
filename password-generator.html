<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Password Generator - Generate Passwords Safely</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #3b82f6;
            --background: #f1f5f9;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --text-main: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            box-sizing: border-box;
        }

        h1 {
            font-size: 24px;
            margin: 0 0 8px 0;
            text-align: center;
            color: #0f172a;
        }

        .subtitle {
            color: #64748b;
            text-align: center;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .output-box {
            background: #f8fafc;
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            gap: 10px;
        }

        .password-display {
            font-family: "Courier New", Courier, monospace;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            word-break: break-all;
            color: #1e293b;
        }

        .action-icon-btn {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.15s;
            white-space: nowrap;
        }

        .action-icon-btn:hover {
            background: #e2e8f0;
        }

        .strength-container {
            margin-bottom: 25px;
        }

        .strength-bar {
            height: 6px;
            background-color: #e2e8f0;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 6px;
        }

        .strength-fill {
            height: 100%;
            width: 25%;
            background-color: #ef4444;
            transition: all 0.3s ease;
        }

        .strength-text {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            color: #64748b;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 14px;
            font-weight: 500;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 60%;
        }

        .slider-container input {
            width: 100%;
            cursor: pointer;
        }

        .length-val {
            font-weight: 700;
            min-width: 20px;
        }

        .checkbox-container input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .generate-trigger-btn {
            width: 100%;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .generate-trigger-btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Secure Password Generator</h1>
    <p class="subtitle">Generate high-entropy keys locally using Cryptographic APIs.</p>

    <div class="output-box">
        <div class="password-display" id="pass-out">••••••••</div>
        <button class="action-icon-btn" onclick="copyPassword()">Copy</button>
    </div>

    <div class="strength-container">
        <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
        <div class="strength-text" id="strength-txt">Strength: Unknown</div>
    </div>

    <div class="setting-row">
        <label>Password Length</label>
        <div class="slider-container">
            <input type="range" id="len-slider" min="6" max="64" value="16">
            <span class="length-val" id="len-indicator">16</span>
        </div>
    </div>

    <div class="setting-row">
        <label>Include Uppercase Letters (A-Z)</label>
        <div class="checkbox-container"><input type="checkbox" id="c-upper" checked></div>
    </div>

    <div class="setting-row">
        <label>Include Lowercase Letters (a-z)</label>
        <div class="checkbox-container"><input type="checkbox" id="c-lower" checked></div>
    </div>

    <div class="setting-row">
        <label>Include Numbers (0-9)</label>
        <div class="checkbox-container"><input type="checkbox" id="c-numbers" checked></div>
    </div>

    <div class="setting-row">
        <label>Include Special Symbols (!@#$%^&*)</label>
        <div class="checkbox-container"><input type="checkbox" id="c-symbols" checked></div>
    </div>

    <button class="generate-trigger-btn" onclick="generateSecurePassword()">Generate Secure Key</button>
</div>

<script>
    const slider = document.getElementById('len-slider');
    const lenIndicator = document.getElementById('len-indicator');
    const passOut = document.getElementById('pass-out');
    const fill = document.getElementById('strength-fill');
    const txt = document.getElementById('strength-txt');

    const chkUpper = document.getElementById('c-upper');
    const chkLower = document.getElementById('c-lower');
    const chkNum = document.getElementById('c-numbers');
    const chkSym = document.getElementById('c-symbols');

    const CHARSETS = {
        upper: 'ABCDEFGHJKLMNPQRSTUVWXYZ', 
        lower: 'abcdefghijkmnopqrstuvwxyz', 
        numbers: '23456789',               
        symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?'
    };

    slider.addEventListener('input', (e) => {
        lenIndicator.innerText = e.target.value;
        generateSecurePassword();
    });

    window.onload = generateSecurePassword;

    function generateSecurePassword() {
        let pool = '';
        if (chkUpper.checked) pool += CHARSETS.upper;
        if (chkLower.checked) pool += CHARSETS.lower;
        if (chkNum.checked) pool += CHARSETS.numbers;
        if (chkSym.checked) pool += CHARSETS.symbols;

        if (!pool) {
            passOut.innerText = 'Select Options';
            updateStrengthMeter(0);
            return;
        }

        const length = parseInt(slider.value);
        let password = '';
        
        const randomValues = new Uint32Array(length);
        window.crypto.getRandomValues(randomValues);

        for (let i = 0; i < length; i++) {
            password += pool.charAt(randomValues[i] % pool.length);
        }

        passOut.innerText = password;
        evaluateEntropy(password, length);
    }

    function evaluateEntropy(pass, length) {
        let optionsCount = 0;
        if (chkUpper.checked) optionsCount += 24;
        if (chkLower.checked) optionsCount += 24;
        if (chkNum.checked) optionsCount += 8;
        if (chkSym.checked) optionsCount += CHARSETS.symbols.length;

        const entropyBits = Math.log2(Math.pow(optionsCount, length));
        updateStrengthMeter(entropyBits);
    }

    function updateStrengthMeter(entropy) {
        if (entropy === 0) {
            fill.style.width = '0%';
            txt.innerText = 'Strength: Unknown';
            return;
        }

        if (entropy < 40) {
            fill.style.width = '25%';
            fill.style.backgroundColor = '#ef4444';
            txt.innerText = 'Strength: Weak';
        } else if (entropy >= 40 && entropy < 60) {
            fill.style.width = '50%';
            fill.style.backgroundColor = '#f59e0b';
            txt.innerText = 'Strength: Medium';
        } else if (entropy >= 60 && entropy < 80) {
            fill.style.width = '75%';
            fill.style.backgroundColor = '#3b82f6';
            txt.innerText = 'Strength: Strong';
        } else {
            fill.style.width = '100%';
            fill.style.backgroundColor = '#10b981';
            txt.innerText = 'Strength: Excellent (Highly Secure)';
        }
    }

    function copyPassword() {
        const text = passOut.innerText;
        if (text === 'Select Options' || text === '••••••••') return;
        
        navigator.clipboard.writeText(text).then(() => {
            alert('Secure key copied to clipboard!');
        });
    }
</script>
</body>
</html>

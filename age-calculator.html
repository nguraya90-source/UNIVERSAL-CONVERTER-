<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronological Age & Milestone Calculator</title>
    <style>
        :root {
            --primary: #2563eb;
            --background: #f1f5f9;
            --card: #ffffff;
            --text-main: #1e293b;
            --border: #cbd5e1;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            box-sizing: border-box;
        }

        h1 {
            font-size: 25px;
            margin: 0 0 6px 0;
            text-align: center;
            color: #0f172a;
        }

        .subtitle {
            color: #64748b;
            text-align: center;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .input-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 13px;
            font-weight: 600;
            color: #475569;
        }

        .input-group input[type="date"] {
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            font-family: inherit;
        }

        .calc-trigger {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s;
        }

        .calc-trigger:hover {
            background: #1d4ed8;
        }

        .results-box {
            display: none;
            margin-top: 30px;
            animation: fadeIn 0.4s ease-in-out;
        }

        .primary-age-badge {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 25px;
        }

        .primary-age-badge .val {
            font-size: 32px;
            font-weight: 800;
            color: var(--primary);
        }

        .primary-age-badge .label {
            font-size: 14px;
            color: #64748b;
            margin-top: 5px;
            font-weight: 500;
        }

        .stats-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
            color: #64748b;
            margin-bottom: 12px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 6px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .stat-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 12px 15px;
            border-radius: 8px;
        }

        .stat-card div:first-child {
            font-size: 12px;
            color: #64748b;
            font-weight: 500;
        }

        .stat-card div:last-child {
            font-size: 16px;
            font-weight: 700;
            color: #334155;
            margin-top: 4px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Chronological Age Calculator</h1>
    <p class="subtitle">Compute exact runtime timelines, intervals, and lifetime milestones.</p>

    <div class="input-row">
        <div class="input-group">
            <label for="birth-date">Date of Birth</label>
            <input type="date" id="birth-date">
        </div>
        <div class="input-group">
            <label for="target-date">Age at the Date of</label>
            <input type="date" id="target-date">
        </div>
    </div>

    <button class="calc-trigger" onclick="calculateAge()">Run Time Calculations</button>

    <div class="results-box" id="results-panel">
        <div class="primary-age-badge">
            <div class="val" id="primary-output">--</div>
            <div class="label" id="detailed-output">--</div>
        </div>

        <div class="stats-title">Extracted Cumulative Metrics</div>
        <div class="stats-grid">
            <div class="stat-card">
                <div>Total Months</div>
                <div id="stat-months">--</div>
            </div>
            <div class="stat-card">
                <div>Total Weeks</div>
                <div id="stat-weeks">--</div>
            </div>
            <div class="stat-card">
                <div>Total Days</div>
                <div id="stat-days">--</div>
            </div>
            <div class="stat-card">
                <div>Total Hours (approx)</div>
                <div id="stat-hours">--</div>
            </div>
        </div>
    </div>
</div>

<script>
    // Self-initialize target inputs to track today's system time parameters automatically
    window.onload = () => {
        const todayStr = new Date().toISOString().split('T')[0];
        document.getElementById('target-date').value = todayStr;
    };

    function calculateAge() {
        const birthInput = document.getElementById('birth-date').value;
        const targetInput = document.getElementById('target-date').value;

        if (!birthInput || !targetInput) {
            alert("Please complete both date fields to run matrix outputs.");
            return;
        }

        const birthDate = new Date(birthInput);
        const targetDate = new Date(targetInput);

        if (birthDate > targetDate) {
            alert("Birth date cannot sit forward in time beyond the target snapshot date.");
            return;
        }

        // Exact Calendar Structural Calculus
        let years = targetDate.getFullYear() - birthDate.getFullYear();
        let months = targetDate.getMonth() - birthDate.getMonth();
        let days = targetDate.getDate() - birthDate.getDate();

        if (days < 0) {
            months--;
            // Determine length boundary parameters of prior targeted calendar month framework
            const prevMonth = new Date(targetDate.getFullYear(), targetDate.getMonth(), 0);
            days += prevMonth.getDate();
        }

        if (months < 0) {
            years--;
            months += 12;
        }

        // Absolute Unix Frame Delta Calculus
        const diffMs = targetDate - birthDate;
        const totalDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
        const totalMonths = (years * 12) + months;
        const totalWeeks = Math.floor(totalDays / 7);
        const totalHours = totalDays * 24;

        // Render variables to screen interface
        document.getElementById('primary-output').innerText = `${years} Years Old`;
        document.getElementById('detailed-output').innerText = `${months} months, ${days} days`;
        
        document.getElementById('stat-months').innerText = totalMonths.toLocaleString();
        document.getElementById('stat-weeks').innerText = totalWeeks.toLocaleString();
        document.getElementById('stat-days').innerText = totalDays.toLocaleString();
        document.getElementById('stat-hours').innerText = totalHours.toLocaleString();

        document.getElementById('results-panel').style.display = 'block';
    }
</script>
</body>
</html>

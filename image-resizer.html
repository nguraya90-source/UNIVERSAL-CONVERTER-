<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Online Image Resizer - Resize & Convert Format</title>
    <style>
        :root {
            --primary: #007bff;
            --primary-hover: #0056b3;
            --background: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #212529;
            --text-muted: #6c757d;
            --border: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }

        h1 {
            font-size: 28px;
            margin: 0 0 10px 0;
            text-align: center;
        }

        .subtitle {
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .drop-zone {
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: #fafbfc;
        }

        .drop-zone:hover, .drop-zone.drag-over {
            border-color: var(--primary);
            background-color: #f0f7ff;
        }

        .drop-zone p {
            margin: 10px 0 0 0;
            font-size: 16px;
            color: var(--text-muted);
        }

        .drop-zone input {
            display: none;
        }

        .workspace {
            display: none;
            margin-top: 30px;
        }

        /* Two Column Layout */
        .grid-workspace {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .grid-workspace {
                grid-template-columns: 1fr;
            }
        }

        /* Left Side Image Container */
        .preview-box {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            background: #fff;
            text-align: center;
            height: fit-content;
        }

        .preview-box h3 {
            margin-top: 0;
            color: var(--text-muted);
            font-size: 16px;
        }

        .img-container {
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .img-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* Right Side Controls */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            display: flex;
            gap: 15px;
        }

        .input-box {
            flex: 1;
        }

        .input-box label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .input-box input[type="number"], .controls select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
        }

        .input-box input:focus, .controls select:focus {
            border-color: var(--primary);
        }

        .aspect-lock {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            user-select: none;
        }

        /* Quick Dimension Presets */
        .presets {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .presets button {
            background-color: #f1f5f9;
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 8px 12px;
            font-size: 13px;
            border-radius: 6px;
            cursor: pointer;
            flex: 1;
        }

        .presets button:hover {
            background-color: #e2e8f0;
        }

        /* Action Buttons */
        .action-row {
            display: flex;
            gap: 15px;
            justify-content: center;
            grid-column: span 2;
        }

        @media (max-width: 768px) {
            .action-row {
                flex-direction: column;
            }
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn.secondary {
            background-color: #cbd5e1;
            color: var(--text-main);
        }

        .btn.secondary:hover {
            background-color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Image Resizer</h1>
    <p class="subtitle">Change image dimensions and convert formats easily on your computer.</p>

    <!-- Upload Box -->
    <div class="drop-zone" id="drop-zone">
        <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="color: var(--primary); margin:0 auto;">
            <path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
        <p>Drag & drop your image here, or <strong>browse files</strong></p>
        <input type="file" id="file-input" accept="image/png, image/jpeg, image/webp">
    </div>

    <!-- Interactive Canvas Workspace -->
    <div class="workspace" id="workspace">
        <div class="grid-workspace">
            
            <!-- Live Preview -->
            <div class="preview-box">
                <h3 id="original-info">Original Size: Loading...</h3>
                <div class="img-container">
                    <img id="image-preview" alt="To Resize Preview">
                </div>
            </div>

            <!-- Size Options -->
            <div class="controls">
                
                <div class="input-group">
                    <div class="input-box">
                        <label for="width-input">Width (px)</label>
                        <input type="number" id="width-input" value="0">
                    </div>
                    <div class="input-box">
                        <label for="height-input">Height (px)</label>
                        <input type="number" id="height-input" value="0">
                    </div>
                </div>

                <div class="aspect-lock">
                    <input type="checkbox" id="aspect-checkbox" checked>
                    <label for="aspect-checkbox">Lock Aspect Ratio</label>
                </div>

                <!-- Fast Presets -->
                <div>
                    <label style="display:block; font-size:14px; font-weight:600; margin-bottom:8px;">Dimension Presets</label>
                    <div class="presets">
                        <button onclick="applyPreset(0.25)">25% Size</button>
                        <button onclick="applyPreset(0.50)">50% Size</button>
                        <button onclick="applyPreset(0.75)">75% Size</button>
                    </div>
                </div>

                <!-- Export settings -->
                <div class="input-box">
                    <label for="format-select">Save As Format</label>
                    <select id="format-select">
                        <option value="image/jpeg">JPEG (.jpg)</option>
                        <option value="image/png">PNG (.png)</option>
                        <option value="image/webp">WebP (.webp)</option>
                    </select>
                </div>

            </div>
        </div>

        <div class="action-row">
            <button class="btn secondary" onclick="resetResizer()">Upload Another File</button>
            <button class="btn" id="resize-download-btn">Resize & Download</button>
        </div>
    </div>
</div>

<script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const workspace = document.getElementById('workspace');
    const imagePreview = document.getElementById('image-preview');
    const originalInfo = document.getElementById('original-info');
    
    const widthInput = document.getElementById('width-input');
    const heightInput = document.getElementById('height-input');
    const aspectCheckbox = document.getElementById('aspect-checkbox');
    const formatSelect = document.getElementById('format-select');
    const downloadBtn = document.getElementById('resize-download-btn');

    let sourceImg = new Image();
    let originalWidth = 0;
    let originalHeight = 0;
    let originalAspectRatio = 1;
    let fileExtensionName = '';

    // Click to Open File Window
    dropZone.addEventListener('click', () => fileInput.click());

    // Drag-over styling
    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('drag-over');
    });

    dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('drag-over');
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
        if (e.dataTransfer.files.length > 0) {
            loadImage(e.dataTransfer.files[0]);
        }
    });

    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            loadImage(e.target.files[0]);
        }
    });

    function loadImage(file) {
        if (!file.type.match('image.*')) {
            alert('Please load an image (JPG, PNG, WEBP).');
            return;
        }

        // Set native format selection to uploaded format by default
        formatSelect.value = file.type;
        fileExtensionName = file.name.split('.')[0];

        const reader = new FileReader();
        reader.onload = (e) => {
            sourceImg.src = e.target.result;
            imagePreview.src = e.target.result;
            
            sourceImg.onload = () => {
                originalWidth = sourceImg.naturalWidth;
                originalHeight = sourceImg.naturalHeight;
                originalAspectRatio = originalWidth / originalHeight;

                // Load defaults into fields
                widthInput.value = originalWidth;
                heightInput.value = originalHeight;
                originalInfo.innerText = `Original Size: ${originalWidth}px × ${originalHeight}px`;

                // Layout swap
                dropZone.style.display = 'none';
                workspace.style.display = 'block';
            };
        };
        reader.readAsDataURL(file);
    }

    // Aspect Ratio Calculations
    widthInput.addEventListener('input', () => {
        if (aspectCheckbox.checked && originalWidth > 0) {
            heightInput.value = Math.round(widthInput.value / originalAspectRatio);
        }
    });

    heightInput.addEventListener('input', () => {
        if (aspectCheckbox.checked && originalHeight > 0) {
            widthInput.value = Math.round(heightInput.value * originalAspectRatio);
        }
    });

    function applyPreset(multiplier) {
        if (originalWidth > 0) {
            widthInput.value = Math.round(originalWidth * multiplier);
            heightInput.value = Math.round(originalHeight * multiplier);
        }
    }

    // Main Draw/Render and Download logic
    downloadBtn.addEventListener('click', () => {
        const targetWidth = parseInt(widthInput.value);
        const targetHeight = parseInt(heightInput.value);

        if (isNaN(targetWidth) || targetWidth <= 0 || isNaN(targetHeight) || targetHeight <= 0) {
            alert('Please enter valid width and height numbers.');
            return;
        }

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = targetWidth;
        canvas.height = targetHeight;

        // Render scaled down size onto local Canvas
        ctx.drawImage(sourceImg, 0, 0, targetWidth, targetHeight);

        const activeFormat = formatSelect.value;
        const fileExt = activeFormat.split('/')[1];

        // Export directly from Canvas buffer to file
        canvas.toBlob((blob) => {
            if (!blob) return;

            const finalDownloadUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = finalDownloadUrl;
            a.download = `resized_${fileExtensionName}.${fileExt === 'jpeg' ? 'jpg' : fileExt}`;
            a.click();
            
            // Cleanup references in memory after click
            setTimeout(() => URL.revokeObjectURL(finalDownloadUrl), 100);
        }, activeFormat, 0.92);
    });

    function resetResizer() {
        fileInput.value = '';
        dropZone.style.display = 'block';
        workspace.style.display = 'none';
    }
</script>

</body>
</html>

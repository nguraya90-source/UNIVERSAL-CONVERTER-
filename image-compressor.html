<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Online Image Compressor - Reduce Image Size Instantly</title>
    <style>
        :root {
            --primary: #007bff;
            --primary-hover: #0056b3;
            --success: #28a745;
            --background: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #212529;
            --text-muted: #6c757d;
            --border: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }

        h1 {
            font-size: 28px;
            margin: 0 0 10px 0;
            text-align: center;
        }

        .subtitle {
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 30px;
            font-size: 16px;
        }

        /* Drag & Drop Area */
        .drop-zone {
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: #fafbfc;
        }

        .drop-zone:hover, .drop-zone.drag-over {
            border-color: var(--primary);
            background-color: #f0f7ff;
        }

        .drop-zone p {
            margin: 10px 0 0 0;
            font-size: 16px;
            color: var(--text-muted);
        }

        .drop-zone input {
            display: none;
        }

        /* Controls & Stats */
        .workspace {
            display: none; /* Hidden until file is uploaded */
            margin-top: 30px;
        }

        .control-panel {
            background: #f1f5f9;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .slider-group {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .slider-group label {
            font-weight: 600;
            min-width: 150px;
        }

        .slider-group input[type="range"] {
            flex-grow: 1;
            height: 6px;
            border-radius: 5px;
            cursor: pointer;
        }

        #quality-value {
            font-weight: bold;
            color: var(--primary);
            min-width: 45px;
        }

        /* Comparison Preview Grid */
        .preview-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 650px) {
            .preview-grid {
                grid-template-columns: 1fr;
            }
        }

        .preview-card {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            background: #fff;
        }

        .preview-card h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: var(--text-muted);
        }

        .img-container {
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-color: #f1f5f9;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .img-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .file-size {
            font-size: 15px;
            font-weight: 700;
        }

        .savings-badge {
            background-color: var(--success);
            color: #fff;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
            margin-top: 5px;
        }

        /* Action Buttons */
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button.secondary {
            background-color: #cbd5e1;
            color: var(--text-main);
        }

        button.secondary:hover {
            background-color: #b4c6fc9e;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Image Compressor</h1>
    <p class="subtitle">Compress JPEG, PNG, and WebP images safely and directly in your web browser.</p>

    <!-- Upload Area -->
    <div class="drop-zone" id="drop-zone">
        <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="color: var(--primary); margin:0 auto;">
            <path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
        <p>Drag & drop your image here, or <strong>browse files</strong></p>
        <input type="file" id="file-input" accept="image/png, image/jpeg, image/webp">
    </div>

    <!-- Interactive Workspace -->
    <div class="workspace" id="workspace">
        <div class="control-panel">
            <div class="slider-group">
                <label for="quality-range">Compression Quality:</label>
                <input type="range" id="quality-range" min="10" max="100" value="75">
                <span id="quality-value">75%</span>
            </div>
        </div>

        <div class="preview-grid">
            <!-- Original Preview -->
            <div class="preview-card">
                <h3>Original Image</h3>
                <div class="img-container">
                    <img id="original-preview" alt="Original Preview">
                </div>
                <div class="file-size" id="original-size">0 KB</div>
            </div>

            <!-- Compressed Preview -->
            <div class="preview-card">
                <h3>Compressed Image</h3>
                <div class="img-container">
                    <img id="compressed-preview" alt="Compressed Preview">
                </div>
                <div class="file-size" id="compressed-size">0 KB</div>
                <div class="savings-badge" id="savings-percent">Saved 0%</div>
            </div>
        </div>

        <div class="btn-group">
            <button class="secondary" onclick="resetCompressor()">Upload Different Image</button>
            <button id="download-btn">Download Compressed Image</button>
        </div>
    </div>
</div>

<script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const workspace = document.getElementById('workspace');
    const qualityRange = document.getElementById('quality-range');
    const qualityValue = document.getElementById('quality-value');
    
    const originalPreview = document.getElementById('original-preview');
    const compressedPreview = document.getElementById('compressed-preview');
    const originalSize = document.getElementById('original-size');
    const compressedSize = document.getElementById('compressed-size');
    const savingsPercent = document.getElementById('savings-percent');
    const downloadBtn = document.getElementById('download-btn');

    let rawImageSrc = null;
    let fileName = '';
    let fileType = 'image/jpeg';
    let originalFileSizeBytes = 0;

    // File Drag/Drop Handlers
    dropZone.addEventListener('click', () => fileInput.click());
    
    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('drag-over');
    });

    dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('drag-over');
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
        if (e.dataTransfer.files.length > 0) {
            handleImageLoad(e.dataTransfer.files[0]);
        }
    });

    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            handleImageLoad(e.target.files[0]);
        }
    });

    function handleImageLoad(file) {
        if (!file.type.match('image.*')) {
            alert('Please select a valid image file (JPEG, PNG, WebP).');
            return;
        }

        fileName = file.name;
        fileType = file.type === 'image/png' ? 'image/jpeg' : file.type; // PNG will auto-compress into clean JPEGs for size
        originalFileSizeBytes = file.size;
        originalSize.innerText = formatBytes(originalFileSizeBytes);

        const reader = new FileReader();
        reader.onload = (e) => {
            rawImageSrc = e.target.result;
            originalPreview.src = rawImageSrc;
            
            // Show Workspace, Hide upload drop zone
            dropZone.style.display = 'none';
            workspace.style.display = 'block';
            
            compressImage();
        };
        reader.readAsDataURL(file);
    }

    qualityRange.addEventListener('input', (e) => {
        qualityValue.innerText = `${e.target.value}%`;
        compressImage();
    });

    function compressImage() {
        const img = new Image();
        img.src = rawImageSrc;
        img.onload = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = img.naturalWidth;
            canvas.height = img.naturalHeight;
            
            ctx.drawImage(img, 0, 0);

            const activeQuality = qualityRange.value / 100;
            
            canvas.toBlob((blob) => {
                if (!blob) return;

                // Setup clean Local download URL
                const compressedUrl = URL.createObjectURL(blob);
                compressedPreview.src = compressedUrl;
                compressedSize.innerText = formatBytes(blob.size);

                // Math percentage calculations
                const savings = ((originalFileSizeBytes - blob.size) / originalFileSizeBytes * 100).toFixed(0);
                if (savings > 0) {
                    savingsPercent.style.display = 'inline-block';
                    savingsPercent.innerText = `Saved ${savings}%`;
                } else {
                    savingsPercent.style.display = 'none';
                }

                // Prepare Download Action
                downloadBtn.onclick = () => {
                    const a = document.createElement('a');
                    a.href = compressedUrl;
                    a.download = `compressed_${fileName.split('.')[0]}.jpg`;
                    a.click();
                };
            }, fileType, activeQuality);
        };
    }

    function formatBytes(bytes) {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const dm = 2;
        const sizes = ['Bytes', 'KB', 'MB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
    }

    function resetCompressor() {
        fileInput.value = '';
        dropZone.style.display = 'block';
        workspace.style.display = 'none';
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>Password Generator</title>
<style>
body{font-family:Arial;background:#0f172a;color:white;text-align:center;padding:30px}
button,input{padding:10px;margin:10px}
</style>
</head>
<body>

<h1>🔐 Password Generator</h1>

<input type="number" id="length" value="12" min="4" max="50">

<button onclick="generatePassword()">Generate</button>

<h2 id="result"></h2>h

<script>
function generatePassword(){
const chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*";
const len=parseInt(document.getElementById("length").value);
let password="";

for(let i=0;i<len;i++){
password+=chars.charAt(Math.floor(Math.random()*chars.length));
}

document.getElementById("result").innerText=password;g
}
</script>

</body>
</html>

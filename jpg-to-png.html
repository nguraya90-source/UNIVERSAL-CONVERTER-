<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convert JPG to PNG Online - Free Image Converter</title>
    <style>
        :root {
            --primary: #059669;
            --primary-hover: #047857;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 750px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }

        h1 {
            font-size: 26px;
            margin: 0 0 10px 0;
            text-align: center;
        }

        .subtitle {
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 30px;
            font-size: 15px;
        }

        .drop-zone {
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: #f8fafc;
        }

        .drop-zone:hover, .drop-zone.drag-over {
            border-color: var(--primary);
            background-color: #ecfdf5;
        }

        .drop-zone p {
            margin: 10px 0 0 0;
            font-size: 15px;
            color: var(--text-muted);
        }

        .drop-zone input {
            display: none;
        }

        .workspace {
            display: none;
            margin-top: 25px;
        }

        .preview-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
            max-height: 400px;
            overflow-y: auto;
            padding: 5px;
        }

        .preview-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            border: 1px solid var(--border);
            padding: 12px 15px;
            border-radius: 10px;
            gap: 15px;
        }

        .item-details {
            display: flex;
            align-items: center;
            gap: 15px;
            overflow: hidden;
        }

        .thumb {
            width: 50px;
            height: 50px;
            object-fit: contain;
            background: #f1f5f9;
            border-radius: 6px;
            border: 1px solid var(--border);
            flex-shrink: 0;
        }

        .meta-info {
            overflow: hidden;
        }

        .name-lbl {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .size-lbl {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .action-buttons {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .row-download-btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .row-download-btn:hover {
            background-color: #2563eb;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-weight: 500;
            font-size: 13px;
            padding: 8px;
        }

        .delete-btn:hover {
            text-decoration: underline;
        }

        .btn-group {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        button.main-action {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.main-action:hover {
            background-color: var(--primary-hover);
        }

        button.secondary {
            background-color: #cbd5e1;
            color: var(--text-main);
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
        }

        button.secondary:hover {
            background-color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>JPG to PNG Converter</h1>
    <p class="subtitle">Convert your JPEG images into lossless PNG formats completely in your browser.</p>

    <div class="drop-zone" id="drop-zone">
        <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="color: var(--primary); margin: 0 auto;">
            <path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
        <p>Drag & drop JPG images here, or <strong>click to browse</strong></p>
        <input type="file" id="file-input" accept="image/jpeg, image/jpg" multiple>
    </div>

    <div class="workspace" id="workspace">
        <div class="preview-list" id="preview-list"></div>

        <div class="btn-group">
            <button class="secondary" onclick="resetPage()">Clear All</button>
            <button class="main-action" id="download-all-btn">Download All As PNG</button>
        </div>
    </div>
</div>

<script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const workspace = document.getElementById('workspace');
    const previewList = document.getElementById('preview-list');
    const downloadAllBtn = document.getElementById('download-all-btn');

    let processedImages = [];

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
        if (e.dataTransfer.files.length > 0) processImages(e.dataTransfer.files);
    });

    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) processImages(e.target.files);
    });

    function processImages(files) {
        const filePromises = Array.from(files).map(file => {
            if (!file.type.match('image/jpeg') && !file.type.match('image/jpg')) {
                return Promise.resolve(null);
            }

            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        // Create a hidden canvas layer to render the bitmap data out as a PNG
                        const canvas = document.createElement('canvas');
                        canvas.width = img.naturalWidth;
                        canvas.height = img.naturalHeight;
                        
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0);
                        
                        // Extract canvas matrix data into standard lossless PNG URL framework
                        const pngDataUrl = canvas.toDataURL('image/png');
                        
                        // Generate dynamic output filename template
                        const cleanName = file.name.replace(/\.[^/.]+$/, "") + ".png";

                        resolve({
                            originalSrc: event.target.result,
                            pngSrc: pngDataUrl,
                            outputName: cleanName,
                            dimensions: `${img.naturalWidth} x ${img.naturalHeight} px`,
                            size: (file.size / 1024).toFixed(1) + ' KB'
                        });
                    };
                };
                reader.readAsDataURL(file);
            });
        });

        Promise.all(filePromises).then(results => {
            const validData = results.filter(item => item !== null);
            processedImages = [...processedImages, ...validData];
            if (processedImages.length > 0) {
                updateWorkspaceUI();
            }
        });
    }

    function updateWorkspaceUI() {
        previewList.innerHTML = '';
        
        processedImages.forEach((imgItem, idx) => {
            const row = document.createElement('div');
            row.className = 'preview-row';
            row.innerHTML = `
                <div class="item-details">
                    <img src="${imgItem.originalSrc}" class="thumb">
                    <div class="meta-info">
                        <div class="name-lbl">${imgItem.outputName}</div>
                        <div class="size-lbl">${imgItem.size} | ${imgItem.dimensions}</div>
                    </div>
                </div>
                <div class="action-buttons">
                    <button class="row-download-btn" onclick="downloadSinglePNG(${idx})">Download PNG</button>
                    <button class="delete-btn" onclick="removeImage(${idx})">Remove</button>
                </div>
            `;
            previewList.appendChild(row);
        });

        dropZone.style.display = 'none';
        workspace.style.display = 'block';
    }

    window.downloadSinglePNG = function(idx) {
        const item = processedImages[idx];
        if (!item) return;

        const anchor = document.createElement('a');
        anchor.href = item.pngSrc;
        anchor.download = item.outputName;
        document.body.appendChild(anchor);
        anchor.click();
        document.body.removeChild(anchor);
    };

    window.removeImage = function(idx) {
        processedImages.splice(idx, 1);
        if (processedImages.length === 0) {
            resetPage();
        } else {
            updateWorkspaceUI();
        }
    };

    downloadAllBtn.addEventListener('click', () => {
        processedImages.forEach((_, idx) => {
            setTimeout(() => {
                downloadSinglePNG(idx);
            }, idx * 200); // Small delay stagger keeps the browser download manager stable
        });
    });

    function resetPage() {
        processedImages = [];
        fileInput.value = '';
        dropZone.style.display = 'block';
        workspace.style.display = 'none';
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convert JPG to PDF Online - Free & Secure Image Converter</title>
    <!-- External dependency for compiling PDF documents completely inside the browser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --primary: #dc2626;
            --primary-hover: #b91c1c;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }

        h1 {
            font-size: 26px;
            margin: 0 0 10px 0;
            text-align: center;
        }

        .subtitle {
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 30px;
            font-size: 15px;
        }

        .drop-zone {
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: #f8fafc;
        }

        .drop-zone:hover, .drop-zone.drag-over {
            border-color: var(--primary);
            background-color: #fef2f2;
        }

        .drop-zone p {
            margin: 10px 0 0 0;
            font-size: 15px;
            color: var(--text-muted);
        }

        .drop-zone input {
            display: none;
        }

        .workspace {
            display: none;
            margin-top: 25px;
        }

        .config-panel {
            background-color: #f1f5f9;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            font-size: 14px;
        }

        .config-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .config-group label {
            font-weight: 600;
        }

        .config-group select, .config-group input {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: #fff;
            font-size: 14px;
            outline: none;
        }

        .preview-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 25px;
            max-height: 320px;
            overflow-y: auto;
            padding: 5px;
        }

        .preview-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            border: 1px solid var(--border);
            padding: 10px 15px;
            border-radius: 8px;
        }

        .item-details {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .thumb {
            width: 45px;
            height: 45px;
            object-fit: contain;
            background: #f1f5f9;
            border-radius: 4px;
            border: 1px solid var(--border);
        }

        .name-lbl {
            font-size: 14px;
            font-weight: 500;
            max-width: 280px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .size-lbl {
            font-size: 12px;
            color: var(--text-muted);
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            padding: 5px 10px;
        }

        .delete-btn:hover {
            text-decoration: underline;
        }

        .btn-group {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        button.main-action {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.main-action:hover {
            background-color: var(--primary-hover);
        }

        button.secondary {
            background-color: #cbd5e1;
            color: var(--text-main);
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
        }

        button.secondary:hover {
            background-color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>JPG to PDF Converter</h1>
    <p class="subtitle">Convert your standard JPG images into a clean, single PDF document locally.</p>

    <div class="drop-zone" id="drop-zone">
        <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="color: var(--primary); margin: 0 auto;">
            <path d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
        <p>Drag & drop JPG images here, or <strong>click to browse</strong></p>
        <input type="file" id="file-input" accept="image/jpeg, image/jpg" multiple>
    </div>

    <div class="workspace" id="workspace">
        <div class="config-panel">
            <div class="config-group">
                <label for="layout-mode">Page Orientation</label>
                <select id="layout-mode">
                    <option value="auto">Auto (Match Image Layout)</option>
                    <option value="portrait">Forced Portrait</option>
                    <option value="landscape">Forced Landscape</option>
                </select>
            </div>
            <div class="config-group">
                <label for="doc-title">Document Name</label>
                <input type="text" id="doc-title" value="compiled_images">
            </div>
        </div>

        <div class="preview-list" id="preview-list"></div>

        <div class="btn-group">
            <button class="secondary" onclick="resetPage()">Clear All</button>
            <button class="main-action" id="compile-btn">Download Compile PDF</button>
        </div>
    </div>
</div>

<script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const workspace = document.getElementById('workspace');
    const previewList = document.getElementById('preview-list');
    const layoutMode = document.getElementById('layout-mode');
    const docTitle = document.getElementById('doc-title');
    const compileBtn = document.getElementById('compile-btn');

    let imageList = [];

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
        if (e.dataTransfer.files.length > 0) processFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) processFiles(e.target.files);
    });

    function processFiles(files) {
        const promises = Array.from(files).map(file => {
            if (!file.type.includes('jpeg') && !file.type.includes('jpg')) return Promise.resolve(null);
            
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const tempImg = new Image();
                    tempImg.src = event.target.result;
                    tempImg.onload = () => {
                        resolve({
                            raw: event.target.result,
                            name: file.name,
                            size: (file.size / 1024).toFixed(1) + ' KB',
                            w: tempImg.naturalWidth,
                            h: tempImg.naturalHeight
                        });
                    };
                };
                reader.readAsDataURL(file);
            });
        });

        Promise.all(promises).then(results => {
            const clearData = results.filter(item => item !== null);
            imageList = [...imageList, ...clearData];
            if (imageList.length > 0) {
                updateUI();
            }
        });
    }

    function updateUI() {
        previewList.innerHTML = '';
        imageList.forEach((img, idx) => {
            const row = document.createElement('div');
            row.className = 'preview-row';
            row.innerHTML = `
                <div class="item-details">
                    <img src="${img.raw}" class="thumb">
                    <div>
                        <div class="name-lbl">${img.name}</div>
                        <div class="size-lbl">${img.size} (${img.w}x${img.h}px)</div>
                    </div>
                </div>
                <button class="delete-btn" onclick="removeItem(${idx})">Remove</button>
            `;
            previewList.appendChild(row);
        });

        dropZone.style.display = 'none';
        workspace.style.display = 'block';
    }

    window.removeItem = function(idx) {
        imageList.splice(idx, 1);
        if (imageList.length === 0) {
            resetPage();
        } else {
            updateUI();
        }
    };

    compileBtn.addEventListener('click', () => {
        if (imageList.length === 0) return;
        
        const { jsPDF } = window.jspdf;
        let pdfDoc = null;
        
        imageList.forEach((img, idx) => {
            let orient = img.w > img.h ? 'l' : 'p';
            if (layoutMode.value !== 'auto') {
                orient = layoutMode.value === 'portrait' ? 'p' : 'l';
            }

            // Target baseline coordinates initialization mapping pixels cleanly
            if (idx === 0) {
                pdfDoc = new jsPDF({ orientation: orient, unit: 'px', format: [img.w, img.h] });
            } else {
                pdfDoc.addPage([img.w, img.h], orient);
            }
            
            pdfDoc.addImage(img.raw, 'JPEG', 0, 0, img.w, img.h);
        });

        let savedName = docTitle.value.trim().replace(/[^a-z0-9_-]/gi, '_') || 'document';
        pdfDoc.save(`${savedName}.pdf`);
    });

    function resetPage() {
        imageList = [];
        fileInput.value = '';
        dropZone.style.display = 'block';
        workspace.style.display = 'none';
    }
</script>
</body>
</html>

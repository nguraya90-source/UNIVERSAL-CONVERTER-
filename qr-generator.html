<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic QR Code Generator</title>
    <!-- Cross-browser QR Code generation engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --border: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }

        h1 {
            font-size: 24px;
            margin: 0 0 8px 0;
            text-align: center;
        }

        .subtitle {
            color: #64748b;
            text-align: center;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .input-group label {
            font-size: 14px;
            font-weight: 600;
        }

        .input-group input[type="text"] {
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input[type="text"]:focus {
            border-color: var(--primary);
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
            background: #f1f5f9;
            padding: 15px;
            border-radius: 10px;
        }

        .opt-box {
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 13px;
            font-weight: 500;
        }

        .opt-box input {
            width: 100%;
            height: 35px;
            padding: 0;
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
            box-sizing: border-box;
        }

        .opt-box select {
            height: 35px;
            padding: 5px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: #fff;
        }

        .display-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 25px 0;
            min-height: 220px;
            background: #f8fafc;
            border: 1px dashed var(--border);
            border-radius: 12px;
            padding: 20px;
        }

        #qrcode img {
            display: block;
            max-width: 100%;
            height: auto;
        }

        .action-btn {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 10px;
        }

        .action-btn:hover {
            background-color: var(--primary-hover);
        }

        .download-btn {
            width: 100%;
            background-color: #10b981;
            color: white;
            border: none;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            display: none;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
            transition: background 0.15s;
        }

        .download-btn:hover {
            background-color: #059669;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>QR Code Generator</h1>
    <p class="subtitle">Generate standard vector QR matrices instantly without remote server data leaks.</p>

    <div class="input-group">
        <label for="qr-text">Text content or URL</label>
        <input type="text" id="qr-text" placeholder="https://example.com" value="https://example.com">
    </div>

    <div class="options-grid">
        <div class="opt-box">
            <label>Matrix Color</label>
            <input type="color" id="fg-color" value="#000000">
        </div>
        <div class="opt-box">
            <label>Background Color</label>
            <input type="color" id="bg-color" value="#ffffff">
        </div>
        <div class="opt-box" style="grid-column: span 2;">
            <label>Resolution Scale</label>
            <select id="qr-size">
                <option value="150">Small (150x150)</option>
                <option value="250" selected>Standard (250x250)</option>
                <option value="400">Large (400x400)</option>
            </select>
        </div>
    </div>

    <button class="action-btn" onclick="buildQrCode()">Generate QR Code</button>

    <div class="display-zone">
        <div id="qrcode"></div>
    </div>

    <a href="#" class="download-btn" id="dl-link" download="qrcode.png">Download PNG Image</a>
</div>

<script>
    let qrEngine = null;

    window.onload = () => {
        buildQrCode();
    };

    function buildQrCode() {
        const targetContainer = document.getElementById("qrcode");
        const textVal = document.getElementById("qr-text").value.trim();
        const fgColor = document.getElementById("fg-color").value;
        const bgColor = document.getElementById("bg-color").value;
        const sizeDim = parseInt(document.getElementById("qr-size").value);
        const dlLink = document.getElementById("dl-link");

        if (!textVal) {
            alert("Please type a valid string expression or URL value.");
            return;
        }

        // Wipe container clear for redraw sequences
        targetContainer.innerHTML = "";

        qrEngine = new QRCode(targetContainer, {
            text: textVal,
            width: sizeDim,
            height: sizeDim,
            colorDark: fgColor,
            colorLight: bgColor,
            correctLevel: QRCode.CorrectLevel.H
        });

        // Small execution window delay ensuring async rendering elements populate completely
        setTimeout(() => {
            const canvasEl = targetContainer.querySelector("canvas");
            const imageEl = targetContainer.querySelector("img");

            if (canvasEl) {
                dlLink.href = canvasEl.toDataURL("image/png");
                dlLink.style.display = "block";
            } else if (imageEl && imageEl.src) {
                dlLink.href = imageEl.src;
                dlLink.style.display = "block";
            }
        }, 150);
    }
</script>
</body>
</html>
